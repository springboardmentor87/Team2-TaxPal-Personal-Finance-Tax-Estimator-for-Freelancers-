<div class="rounded-xl border border-gray-100 bg-white p-5 shadow-card">
  <!-- Title -->
  <h3 class="font-display text-[16px] font-bold text-gray-800">Expense Breakdown</h3>

  <div *ngIf="computedSegments().length > 0; else emptyState" class="mt-4 flex flex-col items-center">
    <!-- Solid Pie Chart -->
    <div class="relative h-48 w-48 shrink-0">
      <svg viewBox="0 0 200 200" class="h-full w-full">
        <path
          *ngFor="let seg of computedSegments()"
          [attr.d]="seg.pathD"
          [attr.fill]="seg.color"
          stroke="#ffffff"
          stroke-width="2"
          stroke-linejoin="round"
          class="transition-all duration-300 hover:opacity-90"
        />
      </svg>
    </div>

    <!-- Inline Badge Legend (Square Swatch + Colored Label Text) -->
    <div class="mt-4 flex max-w-[260px] flex-wrap items-center justify-center gap-x-3 gap-y-1.5 text-[13px] font-medium leading-snug">
      <div *ngFor="let seg of computedSegments()" class="flex items-center gap-1.5">
        <span class="h-3 w-3 rounded-[2px] shrink-0" [style.background-color]="seg.color"></span>
        <span [style.color]="seg.color" class="font-semibold">{{ seg.label }}</span>
      </div>
    </div>

    <!-- Category Percentage Breakdown List -->
    <div class="mt-6 w-full space-y-3.5 border-t border-gray-100 pt-4">
      <div
        *ngFor="let seg of computedSegments()"
        class="flex items-center justify-between text-sm"
      >
        <div class="flex items-center gap-3">
          <span class="h-2.5 w-2.5 rounded-full shrink-0" [style.background-color]="seg.color"></span>
          <span class="font-medium text-gray-700">{{ seg.label }}</span>
        </div>
        <span class="font-bold text-gray-900">{{ seg.percent }}%</span>
      </div>
    </div>
  </div>

  <ng-template #emptyState>
    <div class="mt-8 flex flex-col items-center justify-center py-10 text-gray-400">
      <p class="text-sm font-medium text-gray-500">No expense transactions recorded yet</p>
    </div>
  </ng-template>
</div>

<header class="sticky top-0 z-30 flex items-center gap-3 border-b border-border bg-background/80 px-4 py-3 backdrop-blur-md md:px-8">
  <button
    (click)="onMenuClick()"
    class="flex h-10 w-10 items-center justify-center rounded-xl border border-border text-muted-foreground transition-colors hover:bg-secondary lg:hidden"
    aria-label="Open menu"
  >
    <lucide-icon name="Menu" class="h-5 w-5"></lucide-icon>
  </button>

  <div class="hidden flex-1 md:block">
    <h1 class="text-lg font-semibold tracking-tight text-foreground">{{ title }}</h1>
    <p class="text-sm text-muted-foreground">
      {{ subtitle || ("Welcome back " + (userName ? userName : '') + ", here's your financial overview.") }}
    </p>
  </div>

  <!-- Search -->
  <div class="relative ml-auto hidden w-full max-w-xs items-center md:flex">
    <lucide-icon name="Search" class="pointer-events-none absolute left-3 h-4 w-4 text-muted-foreground"></lucide-icon>
    <input
      type="search"
      placeholder="Search transactions..."
      class="h-10 w-full rounded-xl border border-input bg-card pl-9 pr-3 text-sm text-foreground outline-none transition-shadow placeholder:text-muted-foreground focus:ring-2 focus:ring-ring/40"
    />
  </div>

  <button
    class="relative flex h-10 w-10 items-center justify-center rounded-xl border border-border text-muted-foreground transition-colors hover:bg-secondary"
    aria-label="Notifications"
  >
    <lucide-icon name="Bell" class="h-5 w-5"></lucide-icon>
    <span class="absolute right-2.5 top-2.5 h-2 w-2 rounded-full bg-success ring-2 ring-background"></span>
  </button>

  <button
    class="flex items-center gap-2.5 rounded-xl border border-border py-1.5 pl-1.5 pr-3 transition-colors hover:bg-secondary"
    aria-label="User profile"
  >
    <span class="flex h-8 w-8 items-center justify-center rounded-lg bg-primary text-sm font-semibold text-primary-foreground">
      {{ userName ? userName.charAt(0).toUpperCase() : 'U' }}
    </span>
    <span class="hidden text-left sm:block">
      <span class="block text-sm font-medium leading-none text-foreground">{{ userName || 'User' }}</span>
      <span class="mt-0.5 block text-xs text-muted-foreground">Premium</span>
    </span>
  </button>
</header>

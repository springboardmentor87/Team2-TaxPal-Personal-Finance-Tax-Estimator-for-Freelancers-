<header class="sticky top-0 z-30 flex items-center justify-between gap-4 bg-[#F8F7FC] px-6 py-4 lg:px-8">
  <!-- Mobile Menu Toggle -->
  <button
    (click)="onMenuClick()"
    class="flex h-10 w-10 items-center justify-center rounded-full border border-gray-200 bg-white text-gray-600 shadow-sm transition-colors hover:bg-gray-50 lg:hidden"
    aria-label="Open menu"
  >
    <lucide-icon name="Menu" class="h-5 w-5"></lucide-icon>
  </button>

  <!-- Title/Subtitle -->
  <div class="hidden flex-1 md:block">
    <p class="text-sm font-medium text-gray-400">
      {{ subtitle || ("Welcome back, " + displayUserName + "! Here's your financial overview.") }}
    </p>
  </div>

  <!-- Search + Notifications + Profile -->
  <div class="ml-auto flex items-center gap-3.5">
    <!-- Search Bar -->
    <div class="relative hidden w-64 items-center md:flex sm:w-80">
      <lucide-icon name="Search" class="pointer-events-none absolute left-4 h-4 w-4 text-gray-400"></lucide-icon>
      <input
        type="search"
        placeholder="Search transactions..."
        class="h-10 w-full rounded-full border border-gray-300 bg-white pl-11 pr-4 text-sm text-gray-800 outline-none transition-all placeholder:text-gray-400 focus:border-purple-500 focus:ring-2 focus:ring-purple-100"
      />
    </div>

    <!-- Notification Bell Button -->
    <button
      class="relative flex h-10 w-10 items-center justify-center rounded-full border border-gray-200 bg-white shadow-sm transition-colors hover:bg-gray-50"
      aria-label="Notifications"
    >
      <lucide-icon name="Bell" class="h-4 w-4 text-gray-600"></lucide-icon>
      <span class="absolute right-2.5 top-2.5 h-2 w-2 rounded-full bg-[#10B981] ring-2 ring-white"></span>
    </button>

    <!-- User Profile Avatar -->
    <div class="flex items-center gap-2.5 pl-1">
      <span class="flex h-9 w-9 items-center justify-center rounded-full bg-gray-200 text-sm font-bold text-gray-700">
        {{ userInitial }}
      </span>
      <div class="hidden text-left sm:block">
        <span class="block text-xs font-semibold text-gray-400 leading-none">{{ displayUserName }}</span>
        <span class="mt-0.5 block text-xs font-medium text-gray-600 leading-none">Premium</span>
      </div>
    </div>
  </div>
</header>

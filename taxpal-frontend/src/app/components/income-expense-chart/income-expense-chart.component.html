<div
  class="rounded-2xl border border-primary-100/60 bg-white p-5 shadow-card sm:p-6"
>
  <!-- Header -->
  <div class="flex flex-wrap items-center justify-between gap-3">
    <div>
      <h3 class="font-display text-[16px] font-bold text-[#1E1533]">
        Income vs Expense
      </h3>

      <p class="mt-0.5 text-[12.5px] text-[#8A7FA5]">
        Cash flow comparison over time
      </p>
    </div>

    <!-- Period buttons -->
    <div class="flex items-center gap-1 rounded-full bg-secondary p-1">
      <button
        *ngFor="let p of periods"
        (click)="setPeriod(p.key)"
        class="rounded-full px-4 py-1.5 text-[12.5px] font-semibold transition-all duration-200"
        [class.bg-primary]="activePeriod() === p.key"
        [class.text-primary-foreground]="activePeriod() === p.key"
        [class.shadow-sm]="activePeriod() === p.key"
        [class.text-muted-foreground]="activePeriod() !== p.key"
      >
        {{ p.label }}
      </button>
    </div>
  </div>

  <!-- Legend -->
  <div class="mt-5 flex items-center gap-6">
    <div class="flex items-center gap-2">
      <span class="h-3 w-3 rounded-full bg-purple-600"></span>
      <span class="text-[12.5px] font-medium text-[#6B6280]"> Income </span>
    </div>

    <div class="flex items-center gap-2">
      <span class="h-3 w-3 rounded-full bg-purple-200"></span>
      <span class="text-[12.5px] font-medium text-[#6B6280]"> Expense </span>
    </div>
  </div>

  <!-- Chart -->
  <div class="mt-6 flex h-64 items-end justify-between gap-4 sm:gap-6">
    <div
      *ngFor="let point of data()"
      class="flex h-full flex-1 flex-col items-center justify-end"
    >
      <!-- Bars -->
      <div class="flex h-full w-full items-end justify-center gap-2">
        <!-- Income bar -->
        <div
          class="w-4 rounded-t-md bg-gradient-to-t from-purple-700 to-purple-400 transition-all duration-300 sm:w-5"
          [style.height.%]="barHeight(point.income)"
          [title]="'Income: ' + point.income"
        ></div>

        <!-- Expense bar -->
        <div
          class="w-4 rounded-t-md bg-purple-200 transition-all duration-300 sm:w-5"
          [style.height.%]="barHeight(point.expense)"
          [title]="'Expense: ' + point.expense"
        ></div>
      </div>

      <!-- Month labels -->
      <span class="mt-3 text-xs font-medium text-[#8A7FA5]">
        {{ point.label }}
      </span>
    </div>
  </div>
</div>

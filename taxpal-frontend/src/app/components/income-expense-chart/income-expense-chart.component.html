<div class="rounded-2xl border border-primary-100/60 bg-white p-5 shadow-card sm:p-6">
  <div class="flex flex-wrap items-center justify-between gap-3">
    <div>
      <h3 class="font-display text-[16px] font-bold text-[#1E1533]">Income vs Expense</h3>
      <p class="mt-0.5 text-[12.5px] text-[#8A7FA5]">Cash flow comparison over time</p>
    </div>

    <div class="flex items-center gap-1 rounded-full bg-primary-50 p-1">
      <button
        *ngFor="let p of periods"
        (click)="setPeriod(p.key)"
        class="rounded-full px-3.5 py-1.5 text-[12.5px] font-semibold transition-all duration-200"
        [class.bg-primary-500]="activePeriod() === p.key"
        [class.text-white]="activePeriod() === p.key"
        [class.shadow-soft]="activePeriod() === p.key"
        [class.text-primary-600]="activePeriod() !== p.key"
      >
        {{ p.label }}
      </button>
    </div>
  </div>

  <!-- legend -->
  <div class="mt-5 flex items-center gap-5">
    <div class="flex items-center gap-2">
      <span class="h-2.5 w-2.5 rounded-full bg-primary-500"></span>
      <span class="text-[12.5px] font-medium text-[#6B6280]">Income</span>
    </div>
    <div class="flex items-center gap-2">
      <span class="h-2.5 w-2.5 rounded-full bg-primary-200"></span>
      <span class="text-[12.5px] font-medium text-[#6B6280]">Expense</span>
    </div>
  </div>

  <!-- chart -->
  <div class="mt-6 flex h-56 items-end justify-between gap-2 sm:gap-4">
    <div *ngFor="let point of data()" class="flex h-full flex-1 flex-col items-center justify-end">
      <div class="flex h-full w-full items-end justify-center gap-1.5">
        <div
          class="w-full max-w-[16px] origin-bottom animate-growBar rounded-t-md bg-gradient-to-t from-primary-600 to-primary-400 sm:max-w-[18px]"
          [style.height.%]="barHeight(point.income)"
          [title]="'Income: ' + point.income"
        ></div>
        <div
          class="w-full max-w-[16px] origin-bottom animate-growBar rounded-t-md bg-primary-200 sm:max-w-[18px]"
          [style.height.%]="barHeight(point.expense)"
          [title]="'Expense: ' + point.expense"
        ></div>
      </div>
      <span class="mt-2.5 text-[12px] font-medium text-[#8A7FA5]">{{ point.label }}</span>
    </div>
  </div>
</div>

<div class="rounded-xl border border-gray-100 bg-white p-5 shadow-card">
  <!-- Header -->
  <div class="flex flex-wrap items-center justify-between gap-3">
    <h3 class="font-display text-[16px] font-bold text-gray-800">
      Income vs Expenses
    </h3>

    <!-- Period Buttons -->
    <div class="flex items-center gap-1.5">
      <button
        *ngFor="let p of periods"
        (click)="setPeriod(p.key)"
        class="rounded-md px-3.5 py-1 text-xs font-semibold transition-all duration-200"
        [class.bg-gray-100]="activePeriod() === p.key"
        [class.text-gray-900]="activePeriod() === p.key"
        [class.font-bold]="activePeriod() === p.key"
        [class.text-gray-500]="activePeriod() !== p.key"
        [class.hover:text-gray-800]="activePeriod() !== p.key"
      >
        {{ p.label }}
      </button>
    </div>
  </div>

  <!-- Chart Area -->
  <div class="mt-6 flex h-60 w-full">
    <!-- Y-Axis Dynamic Labels -->
    <div class="flex flex-col justify-between pr-3 text-right text-xs font-medium text-gray-400 select-none pb-6">
      <span *ngFor="let tick of yAxisTicks()">{{ tick }}</span>
    </div>

    <!-- Chart Grid & Bars Container -->
    <div class="relative flex-1 border-l border-b border-gray-300 pb-0">
      <!-- Horizontal Dotted Grid Lines -->
      <div class="absolute inset-0 flex flex-col justify-between pointer-events-none pb-6">
        <div class="w-full border-b border-dashed border-gray-200"></div>
        <div class="w-full border-b border-dashed border-gray-200"></div>
        <div class="w-full border-b border-dashed border-gray-200"></div>
        <div class="w-full border-b border-dashed border-gray-200"></div>
        <div class="w-full"></div>
      </div>

      <!-- Vertical Dotted Grid Lines per month column -->
      <div class="absolute inset-0 flex justify-between pointer-events-none pb-6">
        <div *ngFor="let point of data()" class="h-full border-r border-dashed border-gray-200 flex-1"></div>
      </div>

      <!-- Bars Container -->
      <div class="relative z-10 flex h-full items-end justify-between px-2 sm:px-6">
        <div
          *ngFor="let point of data()"
          class="flex h-full flex-1 flex-col items-center justify-end"
        >
          <!-- Pair of Bars (Income & Expense) -->
          <div class="flex h-full w-full items-end justify-center gap-1 sm:gap-1.5 pb-[1px]">
            <!-- Income bar (Green) -->
            <div
              class="w-3.5 sm:w-5 rounded-t-[3px] bg-[#10B981] transition-all duration-300 hover:opacity-90"
              [style.height.%]="barHeight(point.income)"
              [title]="'Income: $' + point.income"
            ></div>

            <!-- Expense bar (Red) -->
            <div
              class="w-3.5 sm:w-5 rounded-t-[3px] bg-[#EF4444] transition-all duration-300 hover:opacity-90"
              [style.height.%]="barHeight(point.expense)"
              [title]="'Expenses: $' + point.expense"
            ></div>
          </div>

          <!-- X-Axis Month Labels below the baseline -->
          <span class="translate-y-6 text-xs font-medium text-gray-500">
            {{ point.label }}
          </span>
        </div>
      </div>
    </div>
  </div>

  <!-- Legend at Bottom Center -->
  <div class="mt-10 flex items-center justify-center gap-6">
    <div class="flex items-center gap-1.5">
      <span class="h-3 w-3 rounded-[2px] bg-[#10B981]"></span>
      <span class="text-xs font-semibold text-[#10B981]">Income</span>
    </div>
    <div class="flex items-center gap-1.5">
      <span class="h-3 w-3 rounded-[2px] bg-[#EF4444]"></span>
      <span class="text-xs font-semibold text-[#EF4444]">Expenses</span>
    </div>
  </div>
</div>

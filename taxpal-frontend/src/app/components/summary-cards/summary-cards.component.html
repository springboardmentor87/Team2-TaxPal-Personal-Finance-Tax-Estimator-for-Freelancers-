  <div
    class="group relative overflow-hidden rounded-2xl border border-border bg-card p-5 shadow-sm transition-all duration-300 hover:-translate-y-1 hover:shadow-lg hover:shadow-primary/5 h-full"
  >
    <div class="flex items-start justify-between">
      <div>
        <p class="text-sm font-medium text-muted-foreground">{{ title }}</p>
        <p class="mt-2 text-2xl font-bold tracking-tight text-foreground md:text-3xl">
          {{ amount }}
        </p>
      </div>
      <span [class]="accentClass">
        <lucide-icon [name]="mappedIcon" class="h-5 w-5"></lucide-icon>
      </span>
    </div>
    <div class="mt-4 flex items-center gap-1.5" *ngIf="statusText">
      <span [class]="deltaClass">{{ statusText }}</span>
    </div>
  </div>

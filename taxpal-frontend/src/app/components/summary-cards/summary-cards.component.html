<section
  aria-label="Financial summary"
  class="grid grid-cols-1 gap-4 sm:grid-cols-2 xl:grid-cols-3"
>
  <div
    *ngFor="let card of cards"
    class="group relative overflow-hidden rounded-2xl border border-border bg-card p-5 shadow-sm transition-all duration-300 hover:-translate-y-1 hover:shadow-lg hover:shadow-primary/5"
  >
    <div class="flex items-start justify-between">
      <div>
        <p class="text-sm font-medium text-muted-foreground">{{ card.label }}</p>
        <p class="mt-2 text-2xl font-bold tracking-tight text-foreground md:text-3xl">
          {{ formatCurrency(card.value) }}
        </p>
      </div>
      <span [class]="accentClass(card.accent)">
        <lucide-icon [name]="card.icon" class="h-5 w-5"></lucide-icon>
      </span>
    </div>
    <div class="mt-4 flex items-center gap-1.5">
      <span [class]="deltaClass(card.positive)">{{ card.delta }}</span>
      <span class="text-xs text-muted-foreground">vs. last month</span>
    </div>
  </div>
</section>

<!-- Mobile overlay -->
<div
  *ngIf="open"
  (click)="onClose()"
  class="fixed inset-0 z-40 bg-[#1E1533]/40 backdrop-blur-sm lg:hidden"
></div>

<!-- Sidebar -->
<aside
  class="fixed inset-y-0 left-0 z-50 flex h-full w-[264px] flex-col border-r border-primary-100/70 bg-white transition-transform duration-300 lg:static lg:translate-x-0"
  [class.translate-x-0]="open"
  [class.-translate-x-full]="!open"
>
  <!-- Logo -->
  <div class="flex items-center justify-between px-6 pt-7 pb-6">
    <a routerLink="/dashboard" class="flex items-center gap-3">
      <span
        class="flex h-10 w-10 items-center justify-center rounded-xl bg-gradient-to-br from-purple-500 to-purple-700 shadow-lg"
      >
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
          <path
            d="M4 17L10 11L14 15L20 7"
            stroke="white"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
          <path
            d="M14 7H20V13"
            stroke="white"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </span>

      <span class="font-bold text-xl text-[#1E1533]">
        Tax<span class="text-purple-600">Pal</span>
      </span>
    </a>

    <button (click)="onClose()" class="lg:hidden text-gray-500 text-xl">
      ✕
    </button>
  </div>

  <!-- Navigation -->

  <nav class="flex-1 px-4">
    <p
      class="px-3 mb-3 text-[11px] font-semibold uppercase tracking-wider text-purple-300"
    >
      Menu
    </p>

    <ul class="space-y-2">
      <!-- Dashboard -->
      <li>
        <a
          routerLink="/dashboard"
          routerLinkActive="bg-purple-50 text-purple-700"
          class="flex items-center gap-3 rounded-xl px-3 py-3 text-sm font-medium text-[#4B4363] hover:bg-purple-50 hover:text-purple-700 transition"
        >
          <span class="text-purple-500"> 🏠 </span>

          Dashboard
        </a>
      </li>

      <!-- Income -->
      <li>
        <a
          routerLink="/income"
          routerLinkActive="bg-purple-50 text-purple-700"
          class="flex items-center gap-3 rounded-xl px-3 py-3 text-sm font-medium text-[#4B4363] hover:bg-purple-50 hover:text-purple-700 transition"
        >
          <span class="text-purple-500"> 📈 </span>

          Income
        </a>
      </li>

      <!-- Expense -->
      <li>
        <a
          routerLink="/expense"
          routerLinkActive="bg-purple-50 text-purple-700"
          class="flex items-center gap-3 rounded-xl px-3 py-3 text-sm font-medium text-[#4B4363] hover:bg-purple-50 hover:text-purple-700 transition"
        >
          <span class="text-purple-500"> 💳 </span>

          Expenses
        </a>
      </li>

      <!-- Tax Calendar -->
      <li>
        <a
          routerLink="/tax-calendar"
          routerLinkActive="bg-purple-50 text-purple-700"
          class="flex items-center gap-3 rounded-xl px-3 py-3 text-sm font-medium text-[#4B4363] hover:bg-purple-50 hover:text-purple-700 transition"
        >
          <span class="text-purple-500"> 📅 </span>

          Tax Calendar
        </a>
      </li>

      <!-- Settings -->
      <li>
        <a
          routerLink="/settings"
          routerLinkActive="bg-purple-50 text-purple-700"
          class="flex items-center gap-3 rounded-xl px-3 py-3 text-sm font-medium text-[#4B4363] hover:bg-purple-50 hover:text-purple-700 transition"
        >
          <span class="text-purple-500"> ⚙️ </span>

          Settings
        </a>
      </li>

      <!-- Disabled items -->

      <li
        *ngFor="let item of ['Budget', 'Tax Estimator', 'Reports']"
      >
        <a
          class="flex items-center gap-3 rounded-xl px-3 py-3 text-sm font-medium text-gray-400 cursor-not-allowed"
        >
          <span> ⚙️ </span>

          {{ item }}
        </a>
      </li>
    </ul>
  </nav>

  <!-- Bottom profile & Logout -->
  <div class="border-t border-purple-100 p-4 space-y-2">
    <div *ngIf="authService.currentUser() as user" class="flex items-center justify-between gap-3 rounded-xl p-2.5 bg-purple-50/70 border border-purple-100/50">
      <div class="flex items-center gap-2.5 min-w-0">
        <div class="flex h-9 w-9 shrink-0 items-center justify-center rounded-full bg-gradient-to-br from-purple-500 to-purple-700 text-white text-xs font-bold shadow-sm">
          {{ initials }}
        </div>
        <div class="min-w-0 flex-1">
          <p class="text-xs font-bold text-[#1E1533] truncate">{{ user.name }}</p>
          <p class="text-[11px] text-gray-500 truncate">{{ user.country || user.email }}</p>
        </div>
      </div>
    </div>

    <button
      (click)="onLogout()"
      class="w-full flex items-center justify-center gap-2 rounded-xl px-3 py-2.5 text-xs font-semibold text-red-600 hover:bg-red-50 hover:text-red-700 transition cursor-pointer border border-transparent hover:border-red-100"
    >
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>
      </svg>
      <span>Sign out</span>
    </button>
  </div>
</aside>

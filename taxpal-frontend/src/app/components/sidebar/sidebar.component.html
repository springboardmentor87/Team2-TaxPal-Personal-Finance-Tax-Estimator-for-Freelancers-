<!-- Mobile overlay -->
<div
  *ngIf="open"
  (click)="onClose()"
  class="fixed inset-0 z-40 bg-[#1E1533]/40 backdrop-blur-sm lg:hidden"
></div>

<!-- Sidebar -->
<aside
  class="fixed inset-y-0 left-0 z-50 flex h-full w-[264px] flex-col border-r border-primary-100/70 bg-white transition-transform duration-300 lg:static lg:translate-x-0"
  [class.translate-x-0]="open"
  [class.-translate-x-full]="!open"
>
  <!-- Logo -->
  <div class="flex items-center justify-between px-6 pt-7 pb-6">
    <a routerLink="/dashboard" class="flex items-center gap-3">
      <span
        class="flex h-10 w-10 items-center justify-center rounded-xl bg-gradient-to-br from-purple-500 to-purple-700 shadow-lg"
      >
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
          <path
            d="M4 17L10 11L14 15L20 7"
            stroke="white"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
          <path
            d="M14 7H20V13"
            stroke="white"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </span>

      <span class="font-bold text-xl text-[#1E1533]">
        Tax<span class="text-purple-600">Pal</span>
      </span>
    </a>

    <button (click)="onClose()" class="lg:hidden text-gray-500 text-xl">
      ✕
    </button>
  </div>

  <!-- Navigation -->

  <nav class="flex-1 px-4">
    <p
      class="px-3 mb-3 text-[11px] font-semibold uppercase tracking-wider text-purple-300"
    >
      Menu
    </p>

    <ul class="space-y-2">
      <!-- Dashboard -->
      <li>
        <a
          routerLink="/dashboard"
          routerLinkActive="bg-purple-50 text-purple-700"
          class="flex items-center gap-3 rounded-xl px-3 py-3 text-sm font-medium text-[#4B4363] hover:bg-purple-50 hover:text-purple-700 transition"
        >
          <span class="text-purple-500"> 🏠 </span>

          Dashboard
        </a>
      </li>

      <!-- Income -->
      <li>
        <a
          routerLink="/income"
          routerLinkActive="bg-purple-50 text-purple-700"
          class="flex items-center gap-3 rounded-xl px-3 py-3 text-sm font-medium text-[#4B4363] hover:bg-purple-50 hover:text-purple-700 transition"
        >
          <span class="text-purple-500"> 📈 </span>

          Income
        </a>
      </li>

      <!-- Expense -->
      <li>
        <a
          routerLink="/expense"
          routerLinkActive="bg-purple-50 text-purple-700"
          class="flex items-center gap-3 rounded-xl px-3 py-3 text-sm font-medium text-[#4B4363] hover:bg-purple-50 hover:text-purple-700 transition"
        >
          <span class="text-purple-500"> 💳 </span>

          Expenses
        </a>
      </li>

      <!-- Disabled items -->

      <li
        *ngFor="let item of ['Budget', 'Tax Estimator', 'Reports', 'Settings']"
      >
        <a
          class="flex items-center gap-3 rounded-xl px-3 py-3 text-sm font-medium text-gray-400 cursor-not-allowed"
        >
          <span> ⚙️ </span>

          {{ item }}
        </a>
      </li>
    </ul>
  </nav>

  <!-- Bottom profile -->

  <div class="border-t border-purple-100 p-4">
    <div
      class="flex items-center gap-3 rounded-xl p-3 hover:bg-purple-50 transition"
    >
      <div
        class="flex h-10 w-10 items-center justify-center rounded-full bg-gradient-to-br from-purple-400 to-purple-600 text-white font-bold"
      >
        AM
      </div>

      <div>
        <p class="text-sm font-semibold text-[#1E1533]">Aarav Mehta</p>

        <p class="text-xs text-gray-400">User</p>
      </div>
    </div>
  </div>
</aside>

<div
  class="group relative overflow-hidden rounded-2xl border border-primary-100/60 bg-white p-5 shadow-card transition-all duration-300 ease-out hover:-translate-y-1 hover:shadow-card-hover"
>
  <!-- decorative corner glow -->
  <div class="pointer-events-none absolute -right-6 -top-6 h-24 w-24 rounded-full bg-primary-100/60 opacity-0 blur-xl transition-opacity duration-300 group-hover:opacity-100"></div>

  <div class="relative flex items-start justify-between">
    <div>
      <p class="text-[13px] font-medium text-[#8A7FA5]">{{ title }}</p>
      <p class="mt-2 font-display text-[26px] font-bold leading-none text-[#1E1533]">{{ amount }}</p>
    </div>

    <span class="flex h-11 w-11 shrink-0 items-center justify-center rounded-xl bg-primary-50 text-primary-600 transition-transform duration-300 group-hover:scale-105 group-hover:bg-primary-500 group-hover:text-white">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" [ngSwitch]="icon">
        <ng-container *ngSwitchCase="'income'">
          <path d="M12 19V5"/><path d="M5 12l7-7 7 7"/>
        </ng-container>
        <ng-container *ngSwitchCase="'expense'">
          <path d="M12 5v14"/><path d="M19 12l-7 7-7-7"/>
        </ng-container>
        <ng-container *ngSwitchCase="'balance'">
          <path d="M3 7.5A2.5 2.5 0 0 1 5.5 5H18a1 1 0 0 1 1 1v2"/>
          <rect x="3" y="7" width="18" height="12" rx="2"/>
          <circle cx="15.5" cy="13.5" r="1.25" fill="currentColor" stroke="none"/>
        </ng-container>
        <ng-container *ngSwitchCase="'tax'">
          <rect x="4" y="2.5" width="16" height="19" rx="2"/>
          <path d="M8 7h8"/><path d="M8 11h8"/><path d="M8 15h5"/>
        </ng-container>
      </svg>
    </span>
  </div>

  <div class="relative mt-4 flex items-center gap-1.5">
    <span
      class="flex h-5 w-5 items-center justify-center rounded-full"
      [class.bg-emerald-50]="trend === 'up'"
      [class.text-emerald-600]="trend === 'up'"
      [class.bg-rose-50]="trend === 'down'"
      [class.text-rose-500]="trend === 'down'"
      [class.bg-primary-50]="trend === 'neutral'"
      [class.text-primary-500]="trend === 'neutral'"
    >
      <svg *ngIf="trend === 'up'" width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M6 18L18 6M18 6H9M18 6v9" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <svg *ngIf="trend === 'down'" width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M6 6L18 18M18 18H9M18 18V9" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <svg *ngIf="trend === 'neutral'" width="10" height="10" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="4" fill="currentColor"/></svg>
    </span>
    <p class="text-[12.5px] font-medium text-[#8A7FA5]">{{ statusText }}</p>
  </div>
</div>

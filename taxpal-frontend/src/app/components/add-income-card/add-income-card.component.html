<div class="rounded-2xl border border-gray-100 bg-white p-5 shadow-card md:p-6">
  <div class="mb-5">
    <h2 class="text-lg font-bold text-gray-800">Add Income</h2>
    <p class="text-xs text-gray-500 mt-0.5">
      Enter your income details below to keep track of your earnings.
    </p>
  </div>

  <form [formGroup]="form" (ngSubmit)="handleSubmit()" class="flex flex-col gap-4">
    <div>
      <label for="amount" class="mb-1.5 block text-xs font-semibold text-gray-700">Amount</label>
      <div class="relative">
        <span class="pointer-events-none absolute left-4 top-1/2 flex h-4 min-w-5 -translate-y-1/2 items-center justify-center text-sm font-semibold text-purple-600">
          {{ currency.currencySymbol() }}
        </span>
        <input
          id="amount"
          type="number"
          inputmode="decimal"
          step="0.01"
          min="0"
          [placeholder]="'Enter amount (' + currency.currencySymbol() + ')'"
          formControlName="amount"
          class="h-11 w-full rounded-full border border-purple-100/90 bg-white px-4 text-sm text-gray-800 outline-none transition focus:border-purple-500 focus:ring-2 focus:ring-purple-100 pl-10"
        />
      </div>
    </div>

    <div>
      <label for="category" class="mb-1.5 block text-xs font-semibold text-gray-700">Income Source</label>
      <div class="relative">
        <select
          id="category"
          formControlName="category"
          class="h-11 w-full rounded-full border border-purple-100/90 bg-white px-5 text-sm text-gray-800 outline-none transition focus:border-purple-400 focus:ring-2 focus:ring-purple-100 cursor-pointer appearance-none pr-10"
        >
          <option *ngFor="let c of categories" [value]="c">{{ c }}</option>
        </select>
        <lucide-icon name="ChevronDown" class="pointer-events-none absolute right-4 top-1/2 h-4 w-4 -translate-y-1/2 text-gray-400"></lucide-icon>
      </div>
    </div>

    <div>
      <label for="date" class="mb-1.5 block text-xs font-semibold text-gray-700">Income Date</label>
      <div class="relative">
        <lucide-icon name="CalendarDays" class="pointer-events-none absolute left-2 top-1/2 h-4 w-4 -translate-y-1/2 text-purple-500"></lucide-icon>
        <input
          id="date"
          type="date"
          formControlName="date"
          class="h-11 w-full rounded-full border border-purple-100/90 bg-white px-4 text-sm text-gray-800 outline-none transition focus:border-purple-400 focus:ring-2 focus:ring-purple-100 pl-10"
        />
      </div>
    </div>

    <div>
      <label for="description" class="mb-1.5 block text-xs font-semibold text-gray-700">Income Description</label>
      <textarea
        id="description"
        rows="2"
        placeholder="Enter income description"
        formControlName="description"
        class="w-full rounded-2xl border border-purple-100/90 bg-white px-4 py-3 text-sm text-gray-800 outline-none transition focus:border-purple-400 focus:ring-2 focus:ring-purple-100 resize-none"
      ></textarea>
    </div>

    <p *ngIf="error" class="text-xs font-medium text-red-600" role="alert">
      {{ error }}
    </p>

    <button
      type="submit"
      class="flex w-full h-11 items-center justify-center gap-2 rounded-full bg-gradient-to-r from-purple-600 to-purple-700 text-sm font-bold text-white shadow-md transition-all duration-200 hover:from-purple-700 hover:to-purple-800 active:scale-[0.99]"
    >
      <lucide-icon name="Plus" class="h-4 w-4"></lucide-icon>
      Save Income
    </button>
  </form>
</div>

<section
  aria-label="Financial summary"
  class="grid grid-cols-1 gap-4 sm:grid-cols-2 xl:grid-cols-3"
>
  <div
    *ngFor="let card of cards"
    class="group relative overflow-hidden rounded-2xl border border-purple-100/80 bg-white p-5 shadow-card transition-all duration-300 hover:-translate-y-0.5 hover:shadow-md"
  >
    <div class="flex items-start justify-between">
      <div>
        <p class="text-xs font-semibold text-gray-500 uppercase tracking-wider">{{ card.label }}</p>
        <p class="mt-2 text-2xl font-bold tracking-tight text-[#1E1533] md:text-3xl">
          {{ formatCurrency(card.value) }}
        </p>
      </div>
      <span
        class="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl transition-transform duration-300 group-hover:scale-105"
        [ngClass]="{
          'bg-rose-50 text-rose-600': card.accent === 'rose' || card.accent === 'primary',
          'bg-[#10B981]/10 text-[#10B981]': card.accent === 'emerald' || card.accent === 'success',
          'bg-purple-50 text-purple-600': card.accent === 'purple' || card.accent === 'sky'
        }"
      >
        <lucide-icon [name]="card.icon" class="h-5 w-5"></lucide-icon>
      </span>
    </div>
    <div class="mt-4 flex items-center gap-1.5">
      <span
        class="inline-flex items-center rounded-full px-2.5 py-0.5 text-xs font-semibold"
        [ngClass]="card.positive ? 'bg-emerald-50 text-emerald-700' : 'bg-rose-50 text-rose-700'"
      >
        {{ card.delta }}
      </span>
      <span class="text-xs text-gray-400">vs. last month</span>
    </div>
  </div>
</section>

<div class="flex min-h-screen">
  <app-sidebar
    [open]="sidebarOpen"
    (closeSidebar)="closeSidebar()"
  ></app-sidebar>

  <div class="flex min-w-0 flex-1 flex-col">
    <app-topbar (menuClick)="openSidebar()"></app-topbar>

    <main class="px-5 pt-6 sm:px-8">
      <!-- Summary cards -->
      <section class="grid grid-cols-1 gap-4 sm:grid-cols-2 xl:grid-cols-4">
        <app-summary-cards
          class="animate-fadeUp"
          title="Total Income"
          amount="$93,400"
          statusText="+12.4% vs last quarter"
          trend="up"
          icon="income"
        ></app-summary-cards>

        <app-summary-cards
          class="animate-fadeUp [animation-delay:60ms]"
          title="Total Expenses"
          amount="$58,900"
          statusText="+4.8% vs last quarter"
          trend="down"
          icon="expense"
        ></app-summary-cards>

        <app-summary-cards
          class="animate-fadeUp [animation-delay:120ms]"
          title="Remaining Balance"
          amount="$34,500"
          statusText="On track for savings goal"
          trend="up"
          icon="balance"
        ></app-summary-cards>

        <app-summary-cards
          class="animate-fadeUp [animation-delay:180ms]"
          title="Estimated Tax"
          amount="$14,010"
          statusText="Due Sep 15, 2026"
          trend="neutral"
          icon="tax"
        ></app-summary-cards>
      </section>

      <!-- Charts -->
      <section class="mt-6 grid grid-cols-1 gap-5 xl:grid-cols-[1.4fr_1fr]">
        <app-income-expense-chart></app-income-expense-chart>

        <app-expense-donut-chart></app-expense-donut-chart>
      </section>
    </main>
  </div>
</div>
